add_newline = false
palette = "active"

format = """
$directory$git_branch$git_status
$character"""

[directory]
style = "blue"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = ""
fish_style_pwd_dir_length = 1

[git_branch]
symbol = " "
style = "cyan"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "[$all_status$ahead_behind]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
