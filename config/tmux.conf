## DEFAULT
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g default-terminal "screen-256color"
if 'infocmp -x tmux-256color > /dev/null 2>&1' 'set -g default-terminal "tmux-256color"'
set -g terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
unbind C-b
set -g prefix C-a
set -g prefix2 C-a
bind C-a send-prefix -2
set -g history-limit 102400
set -g set-clipboard on
set -g allow-passthrough on
set -s escape-time 10
set -s focus-events on
set -sg repeat-time 600
setw -g xterm-keys on

## DISPLAY
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history
set -g aggressive-resize on
set -g base-index 1
set -g bell-action none
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#W"
set -g status-interval 5
set -g visual-activity off
set -g visual-bell off
setw -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
setw -g mode-keys vi
setw -g pane-base-index 1

## CLIPBOARD (OSC 52, works in Ghostty on macOS and Linux)
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
set -g mouse on
unbind -T copy-mode-vi Enter

## NAVIGATION
# Prefix pane navigation (vim-style) — triggered by Ghostty Cmd+Opt+arrow via \x01h/j/k/l
# send-keys "" forces a prompt redraw after focus changes
bind h select-pane -L \; send-keys ""
bind j select-pane -D \; send-keys ""
bind k select-pane -U \; send-keys ""
bind l select-pane -R \; send-keys ""

## WINDOW SWITCHING
# Prefix bindings (Ctrl+A + N)
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9
# Root-table bindings (no prefix) — triggered by Ghostty Cmd+1-9 via ESC+N
bind-key -n M-h previous-window
bind-key -n M-l next-window

## THEME (overridden by themes/<name>/tmux.conf)
set -g status-position top
set -g status-bg "#1a1b26"
set -g status-fg "#c0caf5"
set -g status-justify left
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
# Tab-style windows: powerline arrows create a pill/tab shape.
# Inactive: dark pill (#24283b) with muted label.
# Active: purple pill (#bb9af7) with dark label.
set -g window-status-format "#[fg=#24283b,bg=#1a1b26]#[fg=#565f89,bg=#24283b] #I #W #[fg=#24283b,bg=#1a1b26]"
set -g window-status-current-format "#[fg=#bb9af7,bg=#1a1b26]#[fg=#1a1b26,bg=#bb9af7,bold] #I #W #[fg=#bb9af7,bg=#1a1b26]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
set-window-option -g clock-mode-colour "#7aa2f7"
set-window-option -g clock-mode-style 24

if '[ -f ~/.config/tmux/theme.conf ]' 'source ~/.config/tmux/theme.conf'

bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded"

## PLUGINS (TPM - install with prefix+I, update with prefix+U)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# resurrect: restore nvim sessions, full pane contents, and common long-running processes
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 ~tail ~watch ~btop ~htop'

# MUST be the last line
run '~/.tmux/plugins/tpm/tpm'
