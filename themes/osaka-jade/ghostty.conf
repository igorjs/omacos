# Osaka Jade (solarized-osaka.nvim) explicit colors for Ghostty.
# `omacos theme set osaka-jade` writes this into ~/.config/ghostty/theme.conf.
# Osaka Jade is implemented via craftzdog/solarized-osaka.nvim: a jade-tinted
# Solarized dark port with NeoVim color enhancements.
# Using explicit values instead of `theme = name` for reliable cross-version rendering.

background = #002b36
foreground = #839496
cursor-color = #268bd2
cursor-text = #002b36
selection-background = #073642
selection-foreground = #93a1a1

# ANSI palette
palette = 0=#073642
palette = 1=#dc322f
palette = 2=#859900
palette = 3=#b58900
palette = 4=#268bd2
palette = 5=#d33682
palette = 6=#2aa198
palette = 7=#eee8d5
palette = 8=#002b36
palette = 9=#cb4b16
palette = 10=#586e75
palette = 11=#657b83
palette = 12=#839496
palette = 13=#6c71c4
palette = 14=#93a1a1
palette = 15=#fdf6e3
