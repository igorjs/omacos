# Osaka Jade (solarized-osaka.nvim) overlay for tmux.
# `omacos theme set osaka-jade` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#002b36"
set -g status-fg "#839496"
set -g window-status-format "#[fg=#073642,bg=#002b36]#[fg=#586e75,bg=#073642] #I #W #[fg=#073642,bg=#002b36]"
set -g window-status-current-format "#[fg=#268bd2,bg=#002b36]#[fg=#002b36,bg=#268bd2,bold] #I #W #[fg=#268bd2,bg=#002b36]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#2aa198"
set -g message-style "bg=#002b36,fg=#2aa198"
set-window-option -g clock-mode-colour "#268bd2"
