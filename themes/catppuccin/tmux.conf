# Catppuccin Mocha overlay for tmux.
# `omacos theme set catppuccin` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
set -g window-status-format "#[fg=#313244,bg=#1e1e2e]#[fg=#6c7086,bg=#313244] #I #W #[fg=#313244,bg=#1e1e2e]"
set -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W #[fg=#cba6f7,bg=#1e1e2e]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#1e1e2e,fg=#89b4fa"
set-window-option -g clock-mode-colour "#89b4fa"
