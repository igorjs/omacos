# Kanagawa Wave overlay for tmux.
# `omacos theme set kanagawa` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#1f1f28"
set -g status-fg "#dcd7ba"
set -g window-status-format "#[fg=#2a2a37,bg=#1f1f28]#[fg=#727169,bg=#2a2a37] #I #W #[fg=#2a2a37,bg=#1f1f28]"
set -g window-status-current-format "#[fg=#957fb8,bg=#1f1f28]#[fg=#1f1f28,bg=#957fb8,bold] #I #W #[fg=#957fb8,bg=#1f1f28]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#2a2a37"
set -g pane-active-border-style "fg=#7e9cd8"
set -g message-style "bg=#1f1f28,fg=#7e9cd8"
set-window-option -g clock-mode-colour "#7e9cd8"
