# Matte Black (vague.nvim palette) explicit colors for Ghostty.
# `omacos theme set matte-black` writes this into ~/.config/ghostty/theme.conf.
# Matte Black is implemented via vague.nvim: dark, low-saturation, minimal.
# Using explicit values instead of `theme = name` for reliable cross-version rendering.

background = #141415
foreground = #a8a8b3
cursor-color = #a8a8b3
cursor-text = #141415
selection-background = #2a2a2d
selection-foreground = #a8a8b3

# ANSI palette
palette = 0=#1a1a1d
palette = 1=#c07b7b
palette = 2=#7b9c7b
palette = 3=#c0b07b
palette = 4=#7b8fa8
palette = 5=#9b7ba8
palette = 6=#7ba8a8
palette = 7=#787880
palette = 8=#222226
palette = 9=#c07b7b
palette = 10=#7b9c7b
palette = 11=#c0b07b
palette = 12=#7b8fa8
palette = 13=#9b7ba8
palette = 14=#7ba8a8
palette = 15=#a8a8b3
