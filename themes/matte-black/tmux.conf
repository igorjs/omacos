# Matte Black (vague.nvim palette) overlay for tmux.
# `omacos theme set matte-black` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#141415"
set -g status-fg "#a8a8b3"
set -g window-status-format "#[fg=#1a1a1d,bg=#141415]#[fg=#404045,bg=#1a1a1d] #I #W #[fg=#1a1a1d,bg=#141415]"
set -g window-status-current-format "#[fg=#7b8fa8,bg=#141415]#[fg=#141415,bg=#7b8fa8,bold] #I #W #[fg=#7b8fa8,bg=#141415]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#222226"
set -g pane-active-border-style "fg=#7b8fa8"
set -g message-style "bg=#141415,fg=#7b8fa8"
set-window-option -g clock-mode-colour "#7b8fa8"
