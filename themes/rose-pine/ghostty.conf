# Rose Pine (Main) explicit colors for Ghostty.
# `omacos theme set rose-pine` writes this into ~/.config/ghostty/theme.conf.
# Using explicit values instead of `theme = name` for reliable cross-version rendering.

background = #191724
foreground = #e0def4
cursor-color = #524f67
cursor-text = #e0def4
selection-background = #403d52
selection-foreground = #e0def4

