# Rose Pine (Main) overlay for tmux.
# `omacos theme set rose-pine` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#191724"
set -g status-fg "#e0def4"
set -g window-status-format "#[fg=#1f1d2e,bg=#191724]#[fg=#6e6a86,bg=#1f1d2e] #I #W #[fg=#1f1d2e,bg=#191724]"
set -g window-status-current-format "#[fg=#c4a7e7,bg=#191724]#[fg=#191724,bg=#c4a7e7,bold] #I #W #[fg=#c4a7e7,bg=#191724]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#9ccfd8"
set -g message-style "bg=#191724,fg=#9ccfd8"
set-window-option -g clock-mode-colour "#9ccfd8"
