# Ristretto (Monokai Pro ristretto filter) explicit colors for Ghostty.
# `omacos theme set ristretto` writes this into ~/.config/ghostty/theme.conf.
# Ristretto is Monokai Pro's espresso-toned dark variant.
# Using explicit values instead of `theme = name` for reliable cross-version rendering.

background = #2c1e26
foreground = #fff1f3
cursor-color = #fff1f3
cursor-text = #2c1e26
selection-background = #453140
selection-foreground = #fff1f3

# ANSI palette
palette = 0=#1a0e14
palette = 1=#fc618d
palette = 2=#7bd88f
palette = 3=#fce566
palette = 4=#fd9353
palette = 5=#948ae3
palette = 6=#5ad4e6
palette = 7=#e8d5c4
palette = 8=#3e2633
palette = 9=#fc618d
palette = 10=#7bd88f
palette = 11=#fce566
palette = 12=#fd9353
palette = 13=#948ae3
palette = 14=#5ad4e6
palette = 15=#fff1f3
