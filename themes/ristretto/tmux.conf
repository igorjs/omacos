# Ristretto (Monokai Pro ristretto filter) overlay for tmux.
# `omacos theme set ristretto` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#2c1e26"
set -g status-fg "#fff1f3"
set -g window-status-format "#[fg=#3e2633,bg=#2c1e26]#[fg=#5c3d4a,bg=#3e2633] #I #W #[fg=#3e2633,bg=#2c1e26]"
set -g window-status-current-format "#[fg=#fd9353,bg=#2c1e26]#[fg=#2c1e26,bg=#fd9353,bold] #I #W #[fg=#fd9353,bg=#2c1e26]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#3e2633"
set -g pane-active-border-style "fg=#5ad4e6"
set -g message-style "bg=#2c1e26,fg=#fd9353"
set-window-option -g clock-mode-colour "#5ad4e6"
