# Everforest Dark Hard overlay for tmux.
# `omacos theme set everforest` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#2d353b"
set -g status-fg "#d3c6aa"
set -g window-status-format "#[fg=#374145,bg=#2d353b]#[fg=#5c6a72,bg=#374145] #I #W #[fg=#374145,bg=#2d353b]"
set -g window-status-current-format "#[fg=#83c092,bg=#2d353b]#[fg=#2d353b,bg=#83c092,bold] #I #W #[fg=#83c092,bg=#2d353b]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#374145"
set -g pane-active-border-style "fg=#7fbbb3"
set -g message-style "bg=#2d353b,fg=#7fbbb3"
set-window-option -g clock-mode-colour "#7fbbb3"
