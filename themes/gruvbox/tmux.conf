# Gruvbox Dark overlay for tmux.
# `omacos theme set gruvbox` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#282828"
set -g status-fg "#ebdbb2"
set -g window-status-format "#[fg=#3c3836,bg=#282828]#[fg=#665c54,bg=#3c3836] #I #W #[fg=#3c3836,bg=#282828]"
set -g window-status-current-format "#[fg=#d79921,bg=#282828]#[fg=#282828,bg=#d79921,bold] #I #W #[fg=#d79921,bg=#282828]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
set -g message-style "bg=#282828,fg=#fabd2f"
set-window-option -g clock-mode-colour "#83a598"
