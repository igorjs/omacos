# Nord explicit colors for Ghostty.
# `omacos theme set nord` writes this into ~/.config/ghostty/theme.conf.
# Using explicit values instead of `theme = name` for reliable cross-version rendering.

background = #2e3440
foreground = #d8dee9
cursor-color = #d8dee9
cursor-text = #2e3440
selection-background = #434c5e
selection-foreground = #eceff4

# ANSI palette
palette = 0=#3b4252
palette = 1=#bf616a
palette = 2=#a3be8c
palette = 3=#ebcb8b
palette = 4=#81a1c1
palette = 5=#b48ead
palette = 6=#88c0d0
palette = 7=#e5e9f0
palette = 8=#4c566a
palette = 9=#bf616a
palette = 10=#a3be8c
palette = 11=#ebcb8b
palette = 12=#81a1c1
palette = 13=#b48ead
palette = 14=#88c0d0
palette = 15=#eceff4
