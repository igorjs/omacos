# Nord overlay for tmux.
# `omacos theme set nord` writes this into ~/.config/tmux/theme.conf
# which the base tmux.conf sources at the end. Reloaded via `tmux source-file`.

set -g status-bg "#2e3440"
set -g status-fg "#d8dee9"
set -g window-status-format "#[fg=#3b4252,bg=#2e3440]#[fg=#4c566a,bg=#3b4252] #I #W #[fg=#3b4252,bg=#2e3440]"
set -g window-status-current-format "#[fg=#81a1c1,bg=#2e3440]#[fg=#2e3440,bg=#81a1c1,bold] #I #W #[fg=#81a1c1,bg=#2e3440]"
set -g window-status-current-style ""
set -g window-status-separator " "
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g message-style "bg=#2e3440,fg=#88c0d0"
set-window-option -g clock-mode-colour "#81a1c1"
